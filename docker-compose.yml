services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-world-api
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    restart: always
